<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mochignomes 3D</title>
<style>
  :root {
    --bg1: #fff7ea;
    --bg2: #ffe0b8;
    --ink: #4a2a14;
    --muted: #8a6446;
    --panel: rgba(255, 255, 255, 0.8);
    --line: #ecd0ab;
    --accent: #f39a2b;
    --accent-ink: #ffffff;
    --chip: #fff3e2;
    --bubble: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg1: #2c2018; --bg2: #18110c; --ink: #f7e8d6; --muted: #c4a68a;
      --panel: rgba(42, 31, 23, 0.88); --line: #5b4330; --chip: #3a2b20; --bubble: #fff8ee;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg1: #2c2018; --bg2: #18110c; --ink: #f7e8d6; --muted: #c4a68a;
    --panel: rgba(42, 31, 23, 0.88); --line: #5b4330; --chip: #3a2b20; --bubble: #fff8ee;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: radial-gradient(120% 90% at 50% 20%, var(--bg1), var(--bg2));
    background-color: var(--bg2);
    color: var(--ink);
    font-family: ui-rounded, "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .app { display: grid; grid-template-columns: 1fr; min-height: 100vh; }
  @media (min-width: 900px) {
    .app { grid-template-columns: 1fr 400px; }
    .stage { height: 100vh !important; position: sticky; top: 0; }
  }
  .stage { position: relative; height: 58vh; min-height: 340px; overflow: hidden; touch-action: none; }
  .stage canvas { display: block; width: 100%; height: 100%; cursor: grab; }
  .stage canvas:active { cursor: grabbing; }
  .hint {
    position: absolute; left: 0; right: 0; bottom: 10px; text-align: center;
    font-size: 13px; color: var(--muted); pointer-events: none; padding: 0 16px;
  }
  .bubble {
    position: absolute; transform: translate(-50%, -100%);
    background: var(--bubble); color: #3b2210; border: 3px solid #5a2e14; border-radius: 999px;
    padding: 6px 14px; font-weight: 800; font-style: italic; font-size: 15px;
    white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .3s;
  }
  .bubble.show { opacity: 1; }
  .floaty { position: absolute; pointer-events: none; font-weight: 900; font-size: 26px; opacity: 0; transition: opacity .4s; }
  .floaty.show { opacity: 1; }
  .floaty span { position: absolute; animation: float 2.4s ease-in infinite; opacity: 0; }
  .floaty span:nth-child(2) { animation-delay: .8s; font-size: .8em; }
  .floaty span:nth-child(3) { animation-delay: 1.6s; font-size: .65em; }
  #zzz { color: #6d7fd6; }
  #hearts { color: #ee4d6a; }
  #hearts span { animation-name: floatUp; }
  @keyframes float { 0% { transform: translate(0, 0); opacity: 0; } 20% { opacity: 1; } 100% { transform: translate(40px, -70px); opacity: 0; } }
  @keyframes floatUp { 0% { transform: translate(0, 0) scale(.6); opacity: 0; } 20% { opacity: 1; } 100% { transform: translate(-30px, -80px) scale(1.1); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .floaty span { animation-duration: 6s; } }

  .panel { background: var(--panel); backdrop-filter: blur(8px); border-top: 1px solid var(--line); padding: 18px 16px 32px; }
  @media (min-width: 900px) {
    .panel { border-top: 0; border-left: 1px solid var(--line); padding: 24px 22px; overflow-y: auto; height: 100vh; }
  }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { margin: 0 0 8px; color: var(--muted); font-size: 14px; line-height: 1.4; }
  details { border-top: 1px solid var(--line); padding: 12px 0 4px; }
  summary {
    cursor: pointer; font-size: 13px; font-weight: 800; text-transform: uppercase;
    letter-spacing: .08em; color: var(--muted); list-style: none; display: flex; justify-content: space-between;
  }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: "+"; font-size: 16px; }
  details[open] summary::after { content: "–"; }
  .group { margin: 12px 0 10px; }
  .group h3 { font-size: 13px; margin: 0 0 6px; font-weight: 800; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips button {
    font: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
    border: 1px solid var(--line); background: var(--chip); color: var(--ink);
    padding: 6px 10px; border-radius: 999px;
  }
  .chips button.active { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .chips button:focus-visible, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .moods button { border-radius: 12px; padding: 8px 12px; font-size: 14px; }
  .slider { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; margin-bottom: 10px; align-items: center; }
  .slider label { font-weight: 700; font-size: 13px; }
  .slider output { font-variant-numeric: tabular-nums; font-size: 12px; color: var(--muted); }
  .slider input { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .btn {
    font: inherit; font-size: 14px; font-weight: 700; cursor: pointer;
    border: 1px solid var(--line); background: var(--chip); color: var(--ink); padding: 8px 12px; border-radius: 10px;
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div class="app">
  <div class="stage" id="stage">
    <div class="bubble" id="bubble"></div>
    <div class="floaty" id="zzz"><span>Z</span><span>Z</span><span>Z</span></div>
    <div class="floaty" id="hearts"><span>♥</span><span>♥</span><span>♥</span></div>
    <div class="hint">Glisse pour tourner autour · touche-le pour le chatouiller</div>
  </div>
  <aside class="panel">
    <h1>Prototype 3D</h1>
    <p class="sub">Visage et corps se règlent séparément. Une humeur n'est qu'un mélange de départ : change ensuite n'importe quelle pièce.</p>
    <div class="row">
      <button class="btn primary" id="random">Mélange au hasard</button>
      <button class="btn" id="camera">Recentrer la vue</button>
    </div>

    <details open>
      <summary>Humeurs</summary>
      <div class="group"><div class="chips moods" id="moods"></div></div>
    </details>

    <details open>
      <summary>Visage</summary>
      <div class="group"><h3>Yeux</h3><div class="chips" data-channel="eyes"></div></div>
      <div class="group" id="gaze"></div>
      <div class="group"><h3>Sourcils</h3><div class="chips" data-channel="brows"></div></div>
      <div class="group"><h3>Bouche</h3><div class="chips" data-channel="mouth"></div></div>
      <div class="group"><h3>Effets</h3><div class="chips" data-channel="extras"></div></div>
    </details>

    <details open>
      <summary>Corps</summary>
      <div class="group"><h3>Posture</h3><div class="chips" data-channel="posture"></div></div>
      <div class="group"><h3>Bras</h3><div class="chips" data-channel="arms"></div></div>
      <div class="group"><h3>Mouvement</h3><div class="chips" data-channel="motion"></div></div>
    </details>

    <details>
      <summary>Morphing</summary>
      <div class="group" id="sliders"></div>
    </details>
  </aside>
</div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

// =====================================================================
// Catalogue des pièces : chaque canal est indépendant
// =====================================================================
const CHANNELS = {
  eyes: {
    dot: "Ouverts", wide: "Grands ouverts", shiny: "Brillants", arc: "Heureux", closed: "Fermés",
    tired: "Mi-clos", flat: "Plissés", squint: "> <", x: "X", spiral: "Spirales", heart: "Cœurs", star: "Étoiles",
  },
  brows: {
    none: "Aucun", neutral: "Neutres", raised: "Levés", angry: "Froncés", sad: "Inquiets", evil: "Méchants", skeptic: "Sceptique",
  },
  mouth: {
    smile: "Sourire", content: "Satisfaite", laugh: "Rieuse", grin: "Grand sourire", flat: "Fermée", smirk: "En coin",
    pout: "Boudeuse", frown: "Triste", o: "Surprise", open: "Ouverte", scream: "Cri", teeth: "Dents serrées",
    evil: "Méchante", tongue: "Langue tirée", wavy: "Ondulée", kiss: "Bisou",
  },
  extras: {
    blush: "Joues roses", tear: "Larme", tears: "Pleurs", sweat: "Goutte de sueur", vein: "Veine de colère",
    zzz: "Zzz", hearts: "Cœurs flottants", halo: "Auréole",
  },
  posture: { stand: "Debout", sit: "Assis", crouch: "Accroupi", side: "Allongé sur le côté", back: "Sur le dos" },
  arms: { rest: "Au repos", hang: "Ballants", up: "En l'air", wave: "Coucou", hug: "Câlin", flex: "Biceps", hips: "Sur les hanches" },
  motion: { calm: "Calme", hop: "Sautille", dance: "Danse", shake: "Tremble", sway: "Se balance", snore: "Ronfle" },
};

const MORPHS = [
  { key: "belly", label: "Ventre" },
  { key: "muscle", label: "Muscles" },
  { key: "slump", label: "Affaissement" },
  { key: "sick", label: "Maladie" },
  { key: "dirt", label: "Saleté" },
];

// Humeurs = combinaisons de départ
const MOODS = {
  heureuse:   { label: "Heureuse", eyes: "arc", brows: "none", mouth: "laugh", extras: ["blush"], posture: "stand", arms: "rest", motion: "hop", msg: ["Hihi !", "J'suis trop bien là !", "Ça c'est la belle vie !"] },
  rire:       { label: "Mort de rire", eyes: "squint", brows: "none", mouth: "grin", extras: ["blush", "tear"], posture: "stand", arms: "up", motion: "dance", msg: ["Hahaha !", "J'en peux plus !", "Arrête, j'vais exploser !"] },
  coucou:     { label: "Coucou", eyes: "dot", brows: "neutral", mouth: "smile", extras: ["blush"], posture: "stand", arms: "wave", motion: "calm", msg: ["Coucou toi !", "Hé, salut !", "T'es revenu !"] },
  surprise:   { label: "Surprise", eyes: "wide", brows: "raised", mouth: "o", extras: [], posture: "stand", arms: "up", motion: "calm", msg: ["Oh !", "Quoi ?!", "Sérieux ?!"] },
  emerveillee:{ label: "Émerveillée", eyes: "star", brows: "raised", mouth: "laugh", extras: ["blush"], posture: "stand", arms: "up", motion: "hop", msg: ["Wouaaah !", "C'est trop beau !", "Encore, encore !"] },
  amoureuse:  { label: "Amoureuse", eyes: "heart", brows: "none", mouth: "smile", extras: ["blush", "hearts"], posture: "stand", arms: "hug", motion: "sway", msg: ["Je t'aime fort !", "Câlin ?", "Mon préféré !"] },
  musclee:    { label: "Musclée", eyes: "arc", brows: "none", mouth: "grin", extras: ["blush"], posture: "stand", arms: "flex", motion: "calm", morph: { muscle: 1 }, msg: ["Regarde mes biscotos !", "Je me sens invincible !", "Prête pour l'aventure !"] },
  bienmangee: { label: "Bien mangée", eyes: "arc", brows: "none", mouth: "content", extras: ["blush"], posture: "sit", arms: "rest", motion: "calm", morph: { belly: 1 }, msg: ["J'ai trop mangé...", "*rot* Oups !", "C'était délicieux !"] },
  sceptique:  { label: "Sceptique", eyes: "dot", gaze: [0.7, -0.2], brows: "skeptic", mouth: "smirk", extras: [], posture: "stand", arms: "hips", motion: "calm", msg: ["Mouais...", "T'es sûr de toi ?", "J'y crois moyen."] },
  mechante:   { label: "Méchante", eyes: "tired", gaze: [-0.6, 0], brows: "evil", mouth: "evil", extras: [], posture: "stand", arms: "hips", motion: "calm", msg: ["Hé hé hé...", "J'ai un plan...", "Tu vas voir..."] },
  colere:     { label: "En colère", eyes: "dot", brows: "angry", mouth: "teeth", extras: ["vein"], posture: "stand", arms: "hips", motion: "shake", msg: ["GRRR !", "Ça suffit !", "Je suis furieuse !"] },
  grognon:    { label: "Grognon", eyes: "dot", brows: "angry", mouth: "pout", extras: ["blush"], posture: "stand", arms: "rest", motion: "calm", morph: { slump: 0.15 }, msg: ["Grrr...", "Occupe-toi de moi !", "Suis pas contente !"] },
  boudeuse:   { label: "Boudeuse", eyes: "flat", gaze: [-0.8, 0], brows: "angry", mouth: "pout", extras: [], posture: "sit", arms: "hang", motion: "calm", msg: ["Hmpf.", "Je te parle plus.", "..."] },
  effrayee:   { label: "Effrayée", eyes: "wide", brows: "sad", mouth: "scream", extras: ["sweat"], posture: "crouch", arms: "hug", motion: "shake", msg: ["Aaaah !", "J'ai peur !", "C'était quoi ça ?!"] },
  triste:     { label: "Triste", eyes: "dot", brows: "sad", mouth: "frown", extras: ["tear"], posture: "stand", arms: "hang", motion: "sway", morph: { slump: 0.6 }, msg: ["*soupir*", "Personne m'aime...", "La vie est dure..."] },
  pleure:     { label: "Pleure", eyes: "closed", brows: "sad", mouth: "scream", extras: ["tears"], posture: "sit", arms: "hang", motion: "shake", morph: { slump: 0.4 }, msg: ["Bouhouhou !", "Ouiiiin !", "*snif*"] },
  cracra:     { label: "Cracra", eyes: "squint", brows: "none", mouth: "tongue", extras: [], posture: "stand", arms: "rest", motion: "calm", morph: { dirt: 1, slump: 0.2 }, msg: ["Beurk, ça colle !", "Un bain vite !", "*renifle* ouhlala..."] },
  fatiguee:   { label: "Fatiguée", eyes: "tired", brows: "none", mouth: "o", extras: [], posture: "sit", arms: "hang", motion: "sway", morph: { slump: 0.85 }, msg: ["J'ai envie de dormir...", "Bonne nuit ?", "Je pique du nez..."] },
  endormie:   { label: "Endormie", eyes: "closed", brows: "none", mouth: "o", extras: ["blush", "zzz"], posture: "side", arms: "rest", motion: "snore", morph: { slump: 0.2 }, msg: ["Zzz...", "*ronfle bruyamment*", "Rronn... pich !"] },
  malade:     { label: "Malade", eyes: "spiral", brows: "sad", mouth: "wavy", extras: ["sweat"], posture: "sit", arms: "hang", motion: "shake", morph: { sick: 1, slump: 0.5 }, msg: ["J'suis pas bien...", "Docteur...?", "Tout tourne..."] },
  morte:      { label: "Morte", eyes: "x", brows: "none", mouth: "flat", extras: ["halo"], posture: "back", arms: "hang", motion: "calm", morph: { slump: 1, dead: 1 }, msg: ["...", "C'est fini pour moi...", "Oskour..."] },
};
const POKE_MSG = ["Hihi, ça chatouille !", "Hé !", "Encore !", "Arrête, hihi !"];

// État courant (ce que l'utilisateur règle)
const state = {
  eyes: "arc", brows: "none", mouth: "laugh", extras: new Set(["blush"]),
  gazeX: 0, gazeY: 0, posture: "stand", arms: "rest", motion: "hop",
};
const MKEYS = ["belly", "muscle", "slump", "sick", "dirt", "dead"];
const morphCur = Object.fromEntries(MKEYS.map((k) => [k, 0]));
const morphTarget = { ...morphCur };
let currentMood = "heureuse";

// =====================================================================
// Scène
// =====================================================================
const stage = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
stage.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
const CAM_HOME = new THREE.Vector3(0, 1.6, 8.6);
const TARGET_HOME = new THREE.Vector3(0, 0.9, 0);
camera.position.copy(CAM_HOME);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(TARGET_HOME);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 4.5;
controls.maxDistance = 14;
controls.minPolarAngle = 0.3;
controls.maxPolarAngle = 1.62;

scene.add(new THREE.HemisphereLight(0xfff1dc, 0xb7774a, 1.35));
const sun = new THREE.DirectionalLight(0xffffff, 2.1);
sun.position.set(-2.5, 4, 5);
scene.add(sun);

const gradientMap = new THREE.DataTexture(new Uint8Array([120, 200, 255]), 3, 1, THREE.RedFormat);
gradientMap.minFilter = gradientMap.magFilter = THREE.NearestFilter;
gradientMap.needsUpdate = true;

const ORANGE = "#f8a33b";
const OUTLINE = "#5a2e14";

function outlineMaterial(thickness) {
  return new THREE.ShaderMaterial({
    uniforms: { color: { value: new THREE.Color(OUTLINE) }, thickness: { value: thickness } },
    vertexShader: `
      uniform float thickness;
      void main() {
        vec3 p = position + normalize(normal) * thickness;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
      }`,
    fragmentShader: `
      uniform vec3 color;
      void main() {
        gl_FragColor = vec4(color, 1.0);
        #include <colorspace_fragment>
      }`,
    side: THREE.BackSide,
  });
}
const outlineBody = outlineMaterial(0.032);
const outlineSmall = outlineMaterial(0.026);
function withOutline(mesh, mat = outlineSmall) {
  mesh.add(new THREE.Mesh(mesh.geometry, mat));
  return mesh;
}

// =====================================================================
// Texture de peau : le visage est dessiné dessus, pièce par pièce
// =====================================================================
const TEX_W = 2048, TEX_H = 1024, PX = TEX_W / (2 * Math.PI);
const skinCanvas = document.createElement("canvas");
skinCanvas.width = TEX_W; skinCanvas.height = TEX_H;
const ctx = skinCanvas.getContext("2d");
const skinTex = new THREE.CanvasTexture(skinCanvas);
skinTex.colorSpace = THREE.SRGBColorSpace;
skinTex.anisotropy = 8;

function uvp(px, py) {
  const theta = Math.acos(py);
  const s = Math.sin(theta);
  const phi = Math.asin(Math.max(-1, Math.min(1, px / s)));
  return [TEX_W * 0.25 + phi * PX, (theta / Math.PI) * TEX_H];
}
function ink(w = 13) {
  ctx.strokeStyle = OUTLINE; ctx.fillStyle = OUTLINE; ctx.lineWidth = w; ctx.lineCap = "round"; ctx.lineJoin = "round";
}
function line(points, w = 13) {
  ctx.beginPath();
  points.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
  ctx.lineWidth = w; ctx.stroke();
}
function heartPath(cx, cy, r) {
  ctx.beginPath();
  ctx.moveTo(cx, cy + r * 0.9);
  ctx.bezierCurveTo(cx - r * 1.6, cy - r * 0.1, cx - r * 0.8, cy - r * 1.3, cx, cy - r * 0.45);
  ctx.bezierCurveTo(cx + r * 0.8, cy - r * 1.3, cx + r * 1.6, cy - r * 0.1, cx, cy + r * 0.9);
  ctx.closePath();
}
function starPath(cx, cy, r) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + (i * Math.PI) / 5, rr = i % 2 ? r * 0.45 : r;
    const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}

function drawEye(type, cx, cy, s, blink, gx, gy) {
  ink();
  const blinkable = ["dot", "wide", "shiny", "tired"].includes(type);
  if (blinkable && blink) {
    ctx.beginPath(); ctx.arc(cx, cy - 6, 24, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke();
    return;
  }
  const ex = cx + gx * 12, ey = cy + gy * 10;
  switch (type) {
    case "dot":
    case "tired":
      ctx.beginPath(); ctx.ellipse(ex, ey, 21, 28, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(ex - 6, ey - 10, 7, 0, Math.PI * 2); ctx.fill();
      if (type === "tired") {
        ctx.fillStyle = ORANGE; ctx.fillRect(cx - 40, cy - 46, 80, 44);
        line([[cx - 30, cy - 2], [cx + 30, cy - 2]]);
      }
      break;
    case "wide":
      ctx.fillStyle = "#fff"; ctx.lineWidth = 9;
      ctx.beginPath(); ctx.ellipse(cx, cy, 33, 40, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = OUTLINE; ctx.beginPath(); ctx.ellipse(cx + gx * 13, cy + gy * 14, 14, 18, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(cx + gx * 13 - 4, cy + gy * 14 - 6, 5, 0, Math.PI * 2); ctx.fill();
      break;
    case "shiny":
      ctx.beginPath(); ctx.ellipse(ex, ey, 27, 34, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.arc(ex - 8, ey - 12, 10, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(ex + 9, ey + 11, 5, 0, Math.PI * 2); ctx.fill();
      break;
    case "arc":
      ctx.beginPath(); ctx.arc(cx, cy + 14, 34, 1.15 * Math.PI, 1.85 * Math.PI); ctx.stroke(); break;
    case "closed":
      ctx.beginPath(); ctx.arc(cx, cy - 14, 30, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke(); break;
    case "flat":
      line([[cx - 28, cy + 2], [cx + 28, cy + 2]]); break;
    case "squint": {
      const d = s < 0 ? 1 : -1;
      line([[cx - 20 * d, cy - 20], [cx + 18 * d, cy], [cx - 20 * d, cy + 20]]); break;
    }
    case "x":
      line([[cx - 22, cy - 22], [cx + 22, cy + 22]]); line([[cx + 22, cy - 22], [cx - 22, cy + 22]]); break;
    case "spiral":
      ctx.beginPath();
      for (let a = 0; a < Math.PI * 5; a += 0.1) {
        const r = 2 + a * 2.1, x = cx + Math.cos(a * s) * r, y = cy + Math.sin(a * s) * r;
        a ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.lineWidth = 9; ctx.stroke(); break;
    case "heart":
      heartPath(cx, cy, 30); ctx.fillStyle = "#ee4d6a"; ctx.fill(); ctx.lineWidth = 8; ctx.stroke();
      ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(cx - 12, cy - 12, 6, 0, Math.PI * 2); ctx.fill(); break;
    case "star":
      starPath(cx, cy, 38); ctx.fillStyle = "#ffd23f"; ctx.fill(); ctx.lineWidth = 8; ctx.stroke(); break;
  }
}

function drawBrow(type, cx, cy, s) {
  ink(11);
  switch (type) {
    case "neutral":
      ctx.beginPath(); ctx.arc(cx, cy + 10, 52, 1.36 * Math.PI, 1.64 * Math.PI); ctx.stroke(); break;
    case "raised":
      ctx.beginPath(); ctx.arc(cx, cy - 26, 36, 1.2 * Math.PI, 1.8 * Math.PI); ctx.stroke(); break;
    case "angry":
      line([[cx - 30 * s, cy - 34], [cx + 26 * s, cy - 56]], 12); break;
    case "sad":
      line([[cx - 30 * s, cy - 56], [cx + 26 * s, cy - 38]], 11); break;
    case "evil":
      line([[cx - 34 * s, cy - 24], [cx + 30 * s, cy - 58], [cx + 40 * s, cy - 54]], 15); break;
    case "skeptic":
      if (s < 0) { ctx.beginPath(); ctx.arc(cx, cy - 30, 34, 1.2 * Math.PI, 1.8 * Math.PI); ctx.stroke(); }
      else line([[cx - 30, cy - 40], [cx + 30, cy - 36]], 12);
      break;
  }
}

function drawMouth(type, mx, my) {
  ink();
  const DARK = "#6e1f14", TONGUE = "#e8604c";
  const openShape = (w, h, teeth = false) => {
    const path = new Path2D();
    path.moveTo(mx - w / 2, my - h * 0.3);
    path.quadraticCurveTo(mx, my - h * 0.42, mx + w / 2, my - h * 0.3);
    path.bezierCurveTo(mx + w / 2, my + h * 0.95, mx - w / 2, my + h * 0.95, mx - w / 2, my - h * 0.3);
    path.closePath();
    ctx.fillStyle = DARK; ctx.fill(path);
    ctx.save(); ctx.clip(path);
    ctx.fillStyle = TONGUE; ctx.beginPath(); ctx.ellipse(mx, my + h * 0.62, w * 0.32, h * 0.36, 0, 0, Math.PI * 2); ctx.fill();
    if (teeth) { ctx.fillStyle = "#fff"; ctx.fillRect(mx - w / 2, my - h * 0.5, w, h * 0.38); }
    ctx.restore();
    ctx.stroke(path);
  };
  const oval = (rx, ry, tongue = false) => {
    const path = new Path2D(); path.ellipse(mx, my, rx, ry, 0, 0, Math.PI * 2);
    ctx.fillStyle = DARK; ctx.fill(path);
    if (tongue) {
      ctx.save(); ctx.clip(path); ctx.fillStyle = TONGUE;
      ctx.beginPath(); ctx.ellipse(mx, my + ry * 0.8, rx * 0.7, ry * 0.5, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    }
    ctx.stroke(path);
  };
  switch (type) {
    case "smile": ctx.beginPath(); ctx.arc(mx, my - 34, 48, 0.24 * Math.PI, 0.76 * Math.PI); ctx.stroke(); break;
    case "content": ctx.beginPath(); ctx.arc(mx, my - 36, 62, 0.22 * Math.PI, 0.78 * Math.PI); ctx.stroke(); break;
    case "laugh": openShape(122, 66); break;
    case "grin": openShape(156, 80, true); break;
    case "flat": line([[mx - 34, my], [mx + 34, my]]); break;
    case "smirk":
      ctx.beginPath(); ctx.moveTo(mx - 38, my + 4); ctx.quadraticCurveTo(mx + 6, my + 16, mx + 36, my - 14); ctx.stroke(); break;
    case "pout": ctx.beginPath(); ctx.arc(mx, my + 30, 30, 1.2 * Math.PI, 1.8 * Math.PI); ctx.stroke(); break;
    case "frown": ctx.beginPath(); ctx.arc(mx, my + 44, 46, 1.22 * Math.PI, 1.78 * Math.PI); ctx.stroke(); break;
    case "o": oval(17, 22); break;
    case "open": oval(34, 24, true); break;
    case "scream": oval(40, 52, true); break;
    case "teeth": {
      const w = 116, h = 42;
      ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.roundRect(mx - w / 2, my - h / 2, w, h, 16); ctx.fill(); ctx.stroke();
      ctx.lineWidth = 6; line([[mx - w / 2 + 6, my], [mx + w / 2 - 6, my]], 6);
      for (let i = -2; i <= 2; i++) line([[mx + i * 20, my - h / 2 + 4], [mx + i * 20, my + h / 2 - 4]], 6);
      break;
    }
    case "evil": {
      const path = new Path2D();
      path.moveTo(mx - 80, my - 22);
      path.quadraticCurveTo(mx, my + 6, mx + 80, my - 22);
      path.quadraticCurveTo(mx, my + 78, mx - 80, my - 22);
      path.closePath();
      ctx.fillStyle = DARK; ctx.fill(path);
      ctx.save(); ctx.clip(path); ctx.fillStyle = "#fff"; ctx.beginPath();
      ctx.moveTo(mx - 80, my - 30);
      for (let x = -64, up = false; x <= 80; x += 16, up = !up) ctx.lineTo(mx + x, my + (up ? -20 : 12));
      ctx.lineTo(mx + 80, my - 30); ctx.closePath(); ctx.fill(); ctx.restore();
      ctx.stroke(path);
      break;
    }
    case "tongue":
      ctx.fillStyle = TONGUE;
      ctx.beginPath(); ctx.roundRect(mx + 2, my - 4, 34, 42, [0, 0, 17, 17]); ctx.fill();
      ctx.lineWidth = 9; ctx.stroke();
      line([[mx - 42, my + 6], [mx, my - 2], [mx + 42, my + 6]]); break;
    case "wavy": {
      const pts = [];
      for (let x = -50; x <= 50; x += 4) pts.push([mx + x, my + Math.sin((x / 50) * Math.PI * 2) * 9]);
      line(pts, 11); break;
    }
    case "kiss":
      ctx.beginPath(); ctx.arc(mx - 4, my - 11, 12, -0.6 * Math.PI, 0.5 * Math.PI); ctx.stroke();
      ctx.beginPath(); ctx.arc(mx - 4, my + 13, 12, -0.5 * Math.PI, 0.6 * Math.PI); ctx.stroke(); break;
  }
}

function drawSkin(f) {
  ctx.fillStyle = ORANGE; ctx.fillRect(0, 0, TEX_W, TEX_H);
  const [bx, by] = uvp(0, -0.35);
  const g = ctx.createRadialGradient(bx, by, 10, bx, by, 300);
  g.addColorStop(0, "rgba(255,200,110,0.55)"); g.addColorStop(1, "rgba(255,200,110,0)");
  ctx.fillStyle = g; ctx.fillRect(bx - 320, by - 320, 640, 640);

  if (f.muscle > 0.05) {
    ctx.save(); ctx.globalAlpha = Math.min(1, f.muscle * 1.2);
    ctx.strokeStyle = "#c2621b"; ctx.lineCap = "round";
    for (const s of [-1, 1]) {
      const [px, py] = uvp(0.24 * s, -0.12);
      ctx.beginPath(); ctx.arc(px, py - 40, 70, 0.25 * Math.PI, 0.75 * Math.PI); ctx.lineWidth = 9; ctx.stroke();
    }
    for (let r = 0; r < 3; r++) for (const s of [-1, 1]) {
      const [ax, ay] = uvp(0.09 * s, -0.36 - r * 0.13);
      ctx.beginPath(); ctx.moveTo(ax - 22, ay); ctx.quadraticCurveTo(ax, ay + 10, ax + 22, ay); ctx.lineWidth = 8; ctx.stroke();
    }
    const [nx, ny] = uvp(0, -0.36), [, ny2] = uvp(0, -0.72);
    ctx.beginPath(); ctx.moveTo(nx, ny - 10); ctx.lineTo(nx, ny2); ctx.lineWidth = 6; ctx.stroke();
    ctx.restore();
  }
  if (f.dirt > 0.05) {
    ctx.save(); ctx.globalAlpha = 0.55 * f.dirt; ctx.fillStyle = "#6b4220";
    let seed = 7;
    const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
    for (const [sx, sy] of [[-0.5, -0.3], [0.45, -0.52], [0.25, 0.7], [-0.28, -0.68], [0.72, 0.1], [-0.74, 0.12], [0.08, -0.25], [-0.55, 0.55]]) {
      const [x, y] = uvp(sx, sy);
      for (let k = 0; k < 4; k++) { ctx.beginPath(); ctx.arc(x + (rnd() - 0.5) * 40, y + (rnd() - 0.5) * 30, 10 + rnd() * 18, 0, Math.PI * 2); ctx.fill(); }
    }
    ctx.restore();
  }
  if (f.extras.has("blush")) {
    ctx.save(); ctx.globalAlpha = 0.55; ctx.fillStyle = "#f2705a";
    for (const s of [-1, 1]) { const [x, y] = uvp(0.6 * s, 0.25); ctx.beginPath(); ctx.ellipse(x, y, 40, 24, 0, 0, Math.PI * 2); ctx.fill(); }
    ctx.restore();
  }
  if (f.extras.has("tears")) {
    ctx.save(); ctx.globalAlpha = 0.85; ctx.strokeStyle = "#79c8ff"; ctx.lineCap = "round"; ctx.lineWidth = 22;
    for (const s of [-1, 1]) {
      const [x, y] = uvp(0.38 * s, 0.33), [, y2] = uvp(0.4 * s, -0.25);
      ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + 14 * s, (y + y2) / 2, x + 6 * s, y2); ctx.stroke();
    }
    ctx.restore();
  }

  for (const s of [-1, 1]) {
    const [x, y] = uvp(0.34 * s, 0.4);
    drawBrow(f.brows, x, y, s);
    drawEye(f.eyes, x, y, s, f.blink, f.gazeX, f.gazeY);
  }
  const [mx, my] = uvp(0, 0.15);
  drawMouth(f.mouth, mx, my);

  if (f.extras.has("tear")) {
    const [x, y] = uvp(-0.42, 0.27);
    ctx.fillStyle = "#79c8ff"; ctx.strokeStyle = "#2f6fa8"; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(x, y - 26);
    ctx.bezierCurveTo(x + 22, y + 2, x + 16, y + 22, x, y + 22);
    ctx.bezierCurveTo(x - 16, y + 22, x - 22, y + 2, x, y - 26);
    ctx.fill(); ctx.stroke();
  }
  if (f.extras.has("sweat")) {
    const [x, y] = uvp(0.66, 0.6);
    ctx.fillStyle = "#a9dcff"; ctx.strokeStyle = "#2f6fa8"; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(x, y - 40);
    ctx.bezierCurveTo(x + 30, y, x + 22, y + 30, x, y + 30);
    ctx.bezierCurveTo(x - 22, y + 30, x - 30, y, x, y - 40);
    ctx.fill(); ctx.stroke();
  }
  if (f.extras.has("vein")) {
    const [x, y] = uvp(-0.58, 0.68);
    ctx.strokeStyle = "#d8322a"; ctx.lineWidth = 11; ctx.lineCap = "round";
    for (let i = 0; i < 4; i++) {
      ctx.save(); ctx.translate(x, y); ctx.rotate((i * Math.PI) / 2);
      ctx.beginPath(); ctx.arc(26, 26, 18, Math.PI, 1.5 * Math.PI); ctx.stroke(); ctx.restore();
    }
  }
  skinTex.needsUpdate = true;
}

// =====================================================================
// Corps : sphère déformée (morphing)
// =====================================================================
const SY = 1.13;
const BOTTOM = (-0.72 - 0.28 * 0.45) * SY;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function deform(px, py, pz, P, out) {
  const widen = (1 - 0.07 * py) * (1 + 0.07 * (1 - py * py));
  let x = px * widen, z = pz * widen * 0.9, y = py;
  if (y < -0.72) y = -0.72 + (y + 0.72) * 0.45;
  y *= SY;
  if (P.belly > 0) {
    const dx = px, dy = py + 0.3, dz = pz - 0.9;
    const k = P.belly * 0.42 * Math.exp(-(dx * dx * 1.6 + dy * dy * 2.2 + dz * dz * 1.5));
    x += px * k; y += py * k * 0.5; z += pz * k;
    const w = 1 + P.belly * 0.18 * clamp(0.25 - py, 0, 1.2);
    x *= w; z *= w;
  }
  if (P.muscle > 0) {
    const m = P.muscle;
    let k = 0;
    for (const s of [-1, 1]) {
      const dx = px - s * 0.8, dy = py - 0.02, dz = pz - 0.25;
      k += 0.2 * Math.exp(-(dx * dx + dy * dy + dz * dz) / 0.12);
      const ex = Math.abs(px) - 0.3, ey = py + 0.1, ez = pz - 0.92;
      if (Math.sign(px) === s) k += 0.07 * Math.exp(-(ex * ex + ey * ey + ez * ez) / 0.05);
    }
    x += px * k * m; y += py * k * m; z += pz * k * m;
    x *= 1 + m * 0.12 * clamp(py + 0.4, 0, 1) - m * 0.06 * clamp(-py - 0.2, 0, 1);
  }
  if (P.slump > 0) {
    const s = P.slump;
    y = BOTTOM + (y - BOTTOM) * (1 - 0.16 * s);
    const low = clamp((0.3 - py) / 1.3, 0, 1);
    x *= 1 + 0.15 * s * low; z *= 1 + 0.1 * s * low;
    z += s * 0.06 * clamp(py, 0, 1);
  }
  return out.set(x, y, z);
}

const bodyGeo = new THREE.SphereGeometry(1, 96, 72);
const basePos = bodyGeo.attributes.position.array.slice();
const seamGroups = (() => {
  const map = new Map();
  for (let i = 0; i < basePos.length / 3; i++) {
    const key = `${basePos[i * 3].toFixed(4)},${basePos[i * 3 + 1].toFixed(4)},${basePos[i * 3 + 2].toFixed(4)}`;
    if (!map.has(key)) map.set(key, []);
    map.get(key).push(i);
  }
  return [...map.values()].filter((g) => g.length > 1);
})();

// « Flop » : la masse s'affaisse vers le sol comme une gelée.
// down = direction du sol dans le repère du corps, f = intensité (peut dépasser 1 pendant le rebond)
const DOWN = new THREE.Vector3(0, -1, 0);
const _perp = new THREE.Vector3();
function flop(q, down, f) {
  const h = q.dot(down);
  if (f <= 0.001) return h;
  let hn = h * (1 - 0.2 * f);
  const hc = 0.58;
  if (hn > hc) hn = hc + (hn - hc) * Math.max(0.05, 1 - 0.85 * f);
  _perp.copy(q).addScaledVector(down, -h).multiplyScalar(1 + 0.15 * f * (0.6 + 0.4 * Math.max(0, h)));
  q.copy(_perp).addScaledVector(down, hn);
  return hn;
}
function deformFull(px, py, pz, P, out) {
  deform(px, py, pz, P, out);
  flop(out, P.down || DOWN, P.flop || 0);
  return out;
}

const tmp = new THREE.Vector3();
let contactRest = -BOTTOM, contactNow = -BOTTOM;
function rebuildBody(P) {
  const pos = bodyGeo.attributes.position;
  let m0 = -Infinity, m1 = -Infinity;
  for (let i = 0; i < pos.count; i++) {
    deform(basePos[i * 3], basePos[i * 3 + 1], basePos[i * 3 + 2], P, tmp);
    m0 = Math.max(m0, tmp.dot(P.down));
    m1 = Math.max(m1, flop(tmp, P.down, P.flop));
    pos.setXYZ(i, tmp.x, tmp.y, tmp.z);
  }
  contactRest = m0; contactNow = m1;
  pos.needsUpdate = true;
  bodyGeo.computeVertexNormals();
  const n = bodyGeo.attributes.normal;
  for (const g of seamGroups) {
    tmp.set(0, 0, 0);
    for (const i of g) tmp.x += n.getX(i), tmp.y += n.getY(i), tmp.z += n.getZ(i);
    tmp.normalize();
    for (const i of g) n.setXYZ(i, tmp.x, tmp.y, tmp.z);
  }
  n.needsUpdate = true;
  bodyGeo.computeBoundingSphere();
}

const tuftGroup = new THREE.Group();
{
  const curve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(0, -0.12, 0), new THREE.Vector3(0, 0.12, 0),
    new THREE.Vector3(0.04, 0.3, 0), new THREE.Vector3(0.16, 0.42, 0), new THREE.Vector3(0.3, 0.43, 0),
  ]);
  const TS = 40, RS = 16;
  const geo = new THREE.TubeGeometry(curve, TS, 0.1, RS, false);
  const p = geo.attributes.position;
  for (let i = 0; i <= TS; i++) {
    const t = i / TS, c = curve.getPointAt(t), taper = 1 - 0.5 * t * t;
    for (let j = 0; j <= RS; j++) {
      const k = i * (RS + 1) + j;
      p.setXYZ(k, c.x + (p.getX(k) - c.x) * taper, c.y + (p.getY(k) - c.y) * taper, c.z + (p.getZ(k) - c.z) * taper);
    }
  }
  geo.computeVertexNormals();
  tuftGroup.add(withOutline(new THREE.Mesh(geo, limbMat)));
  const tip = withOutline(new THREE.Mesh(new THREE.SphereGeometry(0.05, 16, 12), limbMat));
  tip.position.copy(curve.getPointAt(1));
  tuftGroup.add(tip);
}

}

const panelChips = {};

  const box = document.querySelector(`[data-channel="${channel}"]`);
  panelChips[channel] = {};
  for (const [key, label] of Object.entries(CHANNELS[channel])) {
    const b = document.createElement("button");

}

const moodButtons = {};
const moodBox = document.getElementById("moods");
for (const [key, m] of Object.entries(MOODS)) {
  const b = document.createElement("button");
  b.textContent = m.label;
  b.addEventListener("click", () => applyMood(key));
  moodBox.appendChild(b);
  moodButtons[key] = b;
}

function makeSlider(parent, id, label, min, max, get, set, fmt) {
  const wrap = document.createElement("div");
  wrap.className = "slider";
  wrap.innerHTML = `<label for="${id}">${label}</label><output></output><input type="range" id="${id}" min="${min}" max="${max}" step="0.01">`;
  parent.appendChild(wrap);
  const input = wrap.querySelector("input"), out = wrap.querySelector("output");
  input.addEventListener("input", () => { set(+input.value); currentMood = null; out.textContent = fmt(+input.value); refreshUI(); });
  return () => { input.value = get(); out.textContent = fmt(get()); };
}
const sliderSyncs = [];
const gazeBox = document.getElementById("gaze");
sliderSyncs.push(makeSlider(gazeBox, "gx", "Regard gauche / droite", -1, 1, () => state.gazeX, (v) => (state.gazeX = v), (v) => v.toFixed(1)));
sliderSyncs.push(makeSlider(gazeBox, "gy", "Regard haut / bas", -1, 1, () => state.gazeY, (v) => (state.gazeY = v), (v) => v.toFixed(1)));
const slidersBox = document.getElementById("sliders");
for (const m of MORPHS) {
  sliderSyncs.push(makeSlider(slidersBox, `m-${m.key}`, m.label, 0, 1, () => morphTarget[m.key], (v) => (morphTarget[m.key] = v), (v) => Math.round(v * 100) + " %"));
}

function refreshUI() {
  for (const [ch, chips] of Object.entries(panelChips)) {
    for (const [k, b] of Object.entries(chips)) {
      b.classList.toggle("active", ch === "extras" ? state.extras.has(k) : state[ch] === k);
    }
  }
  for (const [k, b] of Object.entries(moodButtons)) b.classList.toggle("active", k === currentMood);
  sliderSyncs.forEach((f) => f());
}

function applyMood(key) {
  const m = MOODS[key];
  currentMood = key;
  for (const ch of ["eyes", "brows", "mouth", "posture", "arms", "motion"]) state[ch] = m[ch];
  state.extras = new Set(m.extras);
  [state.gazeX, state.gazeY] = m.gaze || [0, 0];
  for (const k of MKEYS) morphTarget[k] = (m.morph && m.morph[k]) || 0;
  refreshUI();
  if (m.motion === "hop" || m.arms === "up") hop(0.3);
  say(pick(m.msg));
}

const pick = (a) => a[Math.floor(Math.random() * a.length)];
document.getElementById("random").addEventListener("click", () => {
  for (const ch of ["eyes", "brows", "mouth", "posture", "arms", "motion"]) state[ch] = pick(Object.keys(CHANNELS[ch]));
  const pool = Object.keys(CHANNELS.extras).filter((k) => k !== "halo");
  state.extras = new Set(pool.filter(() => Math.random() < 0.18));
  state.gazeX = Math.round((Math.random() * 2 - 1) * 10) / 10;
  state.gazeY = Math.round((Math.random() * 1.2 - 0.6) * 10) / 10;
  for (const k of MKEYS) morphTarget[k] = 0;
  morphTarget.belly = Math.random() < 0.3 ? Math.random() : 0;
  morphTarget.muscle = Math.random() < 0.3 ? Math.random() : 0;
  morphTarget.slump = Math.random() < 0.3 ? Math.random() * 0.8 : 0;
  currentMood = null;
  refreshUI();
  hop(0.25);
});
document.getElementById("camera").addEventListener("click", () => {
  camera.position.copy(CAM_HOME); controls.target.copy(TARGET_HOME);
});

// Bulle et effets HTML
const bubble = document.getElementById("bubble");
const zzz = document.getElementById("zzz");
const hearts = document.getElementById("hearts");
let bubbleUntil = 0;
function say(text) { bubble.textContent = text; bubbleUntil = performance.now() + 2600; }

// Chatouilles
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let downAt = null, giggleUntil = 0;
renderer.domElement.addEventListener("pointerdown", (e) => (downAt = [e.clientX, e.clientY]));
renderer.domElement.addEventListener("pointerup", (e) => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 6) return;
  const r = renderer.domElement.getBoundingClientRect();
  pointer.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(pointer, camera);
  if (!raycaster.intersectObject(char, true).length) return;
  if (morphCur.dead > 0.5) { say("..."); return; }
  if (poseCur.flop > 0.5) flopVel += 6; else jigVel += 5;
  if (state.posture === "stand") hop(0.25);
  const asleep = state.motion === "snore" || state.extras.has("zzz");
  if (!asleep) giggleUntil = clock.elapsedTime + 0.9;
  say(asleep ? "Mmh... laisse-moi dormir" : pick(POKE_MSG));
});

// =====================================================================
// Boucle d'animation
// =====================================================================
const clock = new THREE.Clock();
let jig = 0, jigVel = 0, flopJig = 0, flopVel = 0;
const downLocal = new THREE.Vector3(0, -1, 0), invQ = new THREE.Quaternion();
let hopStart = -10, hopPower = 0, nextHop = 2;
let nextBlink = 2, blinkUntil = 0;
let lastSig = "", lastMorphSig = "";
const tint = new THREE.Color(), WHITE = new THREE.Color(1, 1, 1),
  SICK = new THREE.Color(0.55, 0.95, 0.42), DEAD = new THREE.Color(0.5, 0.5, 0.53), BASE = new THREE.Color(ORANGE);

function hop(power) {
  const t = clock.elapsedTime;
  if (t - hopStart < 0.75) return;
  hopStart = t; hopPower = power;
}

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.fov = w / h < 0.8 ? 40 : 30;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);
resize();

const headPt = new THREE.Vector3();
function project(v) {
  const p = v.clone().project(camera);
  return [(p.x * 0.5 + 0.5) * stage.clientWidth, (-p.y * 0.5 + 0.5) * stage.clientHeight];
}
const approach = (cur, target, k) => cur + (target - cur) * k;

function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  const k = Math.min(1, dt * 5);

  // posture (interpolée) et direction du sol vue depuis le corps
  const P = POSTURES[state.posture];
  const kp = Math.min(1, dt * 4);
  const prevFlop = poseCur.flop;
  for (const key in poseCur) poseCur[key] = approach(poseCur[key], P[key], kp);
  poseGroup.rotation.set(poseCur.rx, 0, poseCur.rz);
  downLocal.set(0, -1, 0).applyQuaternion(invQ.copy(poseGroup.quaternion).invert());
  // « blop » : quand il s'étale, la gelée rebondit
  if (P.flop > 0.5 && prevFlop < 0.75 && poseCur.flop >= 0.75) flopVel += 7;
  if (P.flop < 0.5 && prevFlop > 0.6 && poseCur.flop <= 0.6) flopVel -= 4;
  flopVel += (-140 * flopJig - 7 * flopVel) * dt;
  flopJig += flopVel * dt;
  const lying = poseCur.flop > 0.5;
  const flopBreath = lying && morphCur.dead < 0.5 ? Math.sin(t * (state.motion === "snore" ? 1.3 : 2.2)) * 0.08 : 0;

  // morphing
  for (const key of MKEYS) morphCur[key] = approach(morphCur[key], morphTarget[key], k);
  morphCur.down = downLocal;
  morphCur.flop = clamp(poseCur.flop + flopJig + flopBreath, 0, 1.5);
  const morphSig = MKEYS.map((key) => morphCur[key].toFixed(3)).join() + morphCur.flop.toFixed(3) +
    downLocal.x.toFixed(2) + downLocal.y.toFixed(2) + downLocal.z.toFixed(2);
  if (morphSig !== lastMorphSig) { lastMorphSig = morphSig; rebuildBody(morphCur); placeAttachments(morphCur); }
  tint.copy(WHITE).lerp(SICK, morphCur.sick).lerp(DEAD, morphCur.dead);
  bodyMat.color.copy(tint);
  limbMat.color.copy(BASE).multiply(tint);

  // visage
  if (t > nextBlink) { blinkUntil = t + 0.13; nextBlink = t + 2 + Math.random() * 3; }
  const giggling = t < giggleUntil;
  const face = {
    eyes: giggling ? "arc" : state.eyes,
    brows: giggling ? "none" : state.brows,
    mouth: giggling ? "laugh" : state.mouth,
    extras: giggling ? new Set([...state.extras, "blush"]) : state.extras,
    gazeX: state.gazeX, gazeY: state.gazeY,
    blink: t < blinkUntil, muscle: morphCur.muscle, dirt: morphCur.dirt,
  };
  const sig = [face.eyes, face.brows, face.mouth, [...face.extras].sort().join("+"), face.gazeX.toFixed(2), face.gazeY.toFixed(2),
    face.blink, Math.round(face.muscle * 20), Math.round(face.dirt * 20)].join("|");
  if (sig !== lastSig) { lastSig = sig; drawSkin(face); }

  // le corps reste posé au sol même quand il s'écrase
  poseGroup.position.y = CENTER + poseCur.dy - (contactRest - contactNow);
  bodyGroup.position.y = poseCur.lift;
  for (const { s, foot } of feet) {
    foot.position.set(0.42 * s, poseCur.footY, poseCur.footZ);
    foot.rotation.x = poseCur.footRX;
  }

  // ressort
  jigVel += (-180 * jig - 9 * jigVel) * dt;
  jig += jigVel * dt;

  const dead = morphCur.dead > 0.5;
  const motion = state.motion;
  const breathe = dead || lying ? 0 : Math.sin(t * (motion === "snore" ? 1.3 : 2.4)) * (motion === "snore" ? 0.04 : 0.018);

  if (motion === "hop" && t > nextHop && !dead) { hop(0.3); nextHop = t + 2 + Math.random() * 1.5; }
  let y = 0, sy = 1;
  const u = (t - hopStart) / 0.75;
  const hopping = u >= 0 && u < 1;
  if (hopping) {
    if (u < 0.2) sy = 1 - Math.sin((u / 0.2) * Math.PI) * 0.14;
    else {
      const v = (u - 0.2) / 0.8;
      y = Math.sin(v * Math.PI) * hopPower * 2.2;
      sy = 1 + Math.sin(v * Math.PI) * 0.08;
      if (u + dt / 0.75 >= 1) jigVel += 2.5;
    }
  }
  const sq = sy * (1 + breathe) * poseCur.squash - jig;
  const sxz = 1 / Math.sqrt(Math.max(0.5, sq));
  bodyGroup.scale.set(sxz, sq, sxz);

  // mouvements
  let mx = 0, my = 0, mrz = 0, mry = 0;
  if (motion === "dance") { mrz = Math.sin(t * 4) * 0.14; my = Math.abs(Math.sin(t * 4)) * 0.18; mry = Math.sin(t * 2) * 0.35; }
  if (motion === "shake") mx = Math.sin(t * 45) * 0.025;
  if (motion === "sway") mrz = Math.sin(t * 1.1) * 0.08;
  if (motion === "snore") mrz = Math.sin(t * 0.65) * 0.03;
  char.position.set(mx, y + my, 0);
  char.rotation.z = approach(char.rotation.z, mrz, Math.min(1, dt * 6));
  char.rotation.y = approach(char.rotation.y, mry, Math.min(1, dt * 4));
  shadow.scale.setScalar(1 - Math.min(0.5, (y + my) * 0.6));

  // bras
  const m = morphCur.muscle;
  const pose = ARMS[state.arms];
  const flap = motion === "hop" && hopping ? Math.sin(u * Math.PI * 6) * 0.35 : 0;
  for (let i = 0; i < 2; i++) {
    const a = arms[i], tgt = pose[i], c = a.cur;
    c.a = approach(c.a, tgt.a, kp); c.x = approach(c.x, tgt.x, kp); c.e = approach(c.e, tgt.e, kp); c.f = approach(c.f, tgt.f, kp);
    const wave = tgt.wave ? Math.sin(t * 9) * 0.35 : 0;
    const droop = state.arms === "rest" ? morphCur.slump * 0.45 : 0;
    a.pivot.rotation.set(c.x, 0, a.s * (c.a - droop + flap + wave));
    a.upper.scale.set(1 + 0.4 * m, 1 + 0.3 * m, 1 + 0.4 * m);
    a.biceps.scale.setScalar(Math.max(0.001, m * (1.05 + (state.arms === "flex" ? (Math.sin(t * 4) * 0.5 + 0.5) * 0.15 : 0))));
    a.elbow.position.y = -0.36 - 0.06 * m;
    a.elbow.rotation.z = a.s * c.e;
    const f = Math.max(0.001, c.f) * (1 + 0.2 * m);
    a.fore.scale.setScalar(f); a.fist.scale.setScalar(f);
    a.fore.position.y = -0.14 * f; a.fist.position.y = -0.32 * f;
  }

  // mèche
  const lag = hopping ? -Math.cos(u * Math.PI * 2) * 0.25 : 0;
  tuftGroup.rotation.z = -morphCur.slump * 0.95 + (dead ? 0 : Math.sin(t * 2.6) * 0.08) + lag + jig * 2;

  halo.visible = state.extras.has("halo");
  halo.rotation.z = t * 0.8;
  halo.position.y += Math.sin(t * 2) * 0.0015;

  controls.update();
  renderer.render(scene, camera);

  // éléments HTML au-dessus de la tête (en coordonnées écran)
  body.localToWorld(headPt.set(0, SY, 0));
  const up = new THREE.Vector3(0, 1, 0);
  const [hx, hy] = project(headPt.clone().addScaledVector(up, 0.75));
  bubble.style.left = hx + "px";
  bubble.style.top = Math.max(44, hy) + "px";
  bubble.classList.toggle("show", performance.now() < bubbleUntil);
  const [zx, zy] = project(headPt.clone().add(new THREE.Vector3(0.6, 0.3, 0)));
  zzz.style.left = zx + "px"; zzz.style.top = zy + "px";
  zzz.classList.toggle("show", state.extras.has("zzz"));
  const [cx2, cy2] = project(headPt.clone().add(new THREE.Vector3(-0.5, 0.2, 0)));
  hearts.style.left = cx2 + "px"; hearts.style.top = cy2 + "px";
  hearts.classList.toggle("show", state.extras.has("hearts"));

  requestAnimationFrame(frame);
}

applyMood("heureuse");
requestAnimationFrame(frame);
</script>
</body>
</html>
